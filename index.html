<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an install | NorthWatch Tech</title>
<!--
SETUP (about 20 minutes, all free to start):
1. EmailJS (emailjs.com): add an email service, then make two templates.
   Template 1 (to you): To = {{to_email}}, Subject = {{subject}}, Body = <pre style="white-space:pre-wrap">{{summary}}

{{buy_list}}

{{terms}}

Signed: {{signature}} on {{signed_at}}</pre>
   Template 2 (to customer): same body, To = {{to_email}}, Subject = Your NorthWatch Tech order copy.
2. PayPal Business account: developer.paypal.com > Apps > create an app > copy the Client ID.
3. Fill in the CONFIG block below, then upload this file next to your index.html on GitHub Pages.
4. Test in PayPal sandbox first (use the sandbox Client ID), then switch to the live one.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a24;--panel:#162531;--line:#2a3d4c;--text:#e9eff3;--mute:#9fb2c0;--lens:#46c2cf;--lens-d:#0e5760;--warn:#f0b64a;--bad:#ff8d7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.55 Barlow,system-ui,sans-serif}
h1,h2{font-family:"Barlow Semi Condensed",Barlow,sans-serif;margin:0;line-height:1.15}
h1{font-size:2.3rem;font-weight:700}
h2{font-size:1.35rem;font-weight:600;margin-bottom:.8rem}
header,main{max-width:1080px;margin:0 auto;padding:0 1.2rem}
header{padding-top:2rem;padding-bottom:1rem}
header p{color:var(--mute);margin:.5rem 0 0;max-width:60ch}
.layout{display:grid;grid-template-columns:1fr 340px;gap:1.6rem;align-items:start;padding-bottom:3rem}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1.2rem 1.3rem;margin-bottom:1.2rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.modes label{display:block;border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem;cursor:pointer}
.modes input{accent-color:var(--lens);margin-right:.4rem}
.modes label:has(input:checked){border-color:var(--lens);background:#10303a}
.modes small{display:block;color:var(--mute)}
.row{display:flex;align-items:center;gap:1rem;padding:.7rem 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .nm{flex:1}.row .nm small{display:block;color:var(--mute)}
.price{min-width:5rem;text-align:right;font-weight:600}
.step{display:flex;align-items:center;gap:.4rem}
.step button{width:2.4rem;height:2.4rem;border-radius:8px;border:1px solid var(--line);background:#0e1a24;color:var(--text);font-size:1.2rem;cursor:pointer}
.step button:disabled{opacity:.35;cursor:not-allowed}
.step output{min-width:1.8rem;text-align:center;font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.fields .full{grid-column:1/-1}
label.f{display:block;font-size:.95rem;color:var(--mute)}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;margin-top:.25rem;padding:.65rem .75rem;border-radius:8px;border:1px solid var(--line);background:#0e1a24;color:var(--text);font:inherit}
textarea{min-height:5rem}
:focus-visible{outline:2px solid var(--lens);outline-offset:2px}
.terms{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem;background:#0e1a24;font-size:.95rem}
.terms p{margin:.0 0 .7rem}
.chk{display:flex;gap:.6rem;align-items:flex-start;margin:.8rem 0}
.chk input{margin-top:.35rem;accent-color:var(--lens)}
.sig{font:italic 1.5rem "Barlow Semi Condensed",Georgia,serif}
aside{position:sticky;top:1rem}
aside section{margin:0}
.sum{width:100%;border-collapse:collapse;font-size:.95rem}
.sum td{padding:.3rem 0;vertical-align:top}.sum td:last-child{text-align:right;white-space:nowrap}
.sum .tot td{border-top:1px solid var(--line);padding-top:.6rem;font-weight:600;font-size:1.05rem}
.sum .due td{color:var(--lens);font-weight:600}
.note{color:var(--mute);font-size:.9rem}
.btn{display:block;width:100%;margin-top:1rem;padding:.85rem 1rem;border:0;border-radius:8px;background:var(--lens);color:#04262b;font:600 1.05rem Barlow,sans-serif;cursor:pointer}
.btn:disabled{opacity:.5}
#err{display:none;margin-top:.8rem;padding:.7rem .9rem;border:1px solid var(--bad);border-radius:8px;color:var(--bad)}
#done{display:none}
#done h2{color:var(--lens)}
@media(max-width:860px){.layout{grid-template-columns:1fr}aside{position:static}.modes,.fields{grid-template-columns:1fr}h1{font-size:1.9rem}}
</style>
</head>
<body>
<header>
  <h1>Book an install</h1>
  <p>Pick your cameras, see your price right away, sign the agreement, and we will contact you to schedule. Serving LaPaz, Plymouth, and Northern Indiana.</p>
</header>
<main>
<div class="layout" id="app">
  <div>
    <section>
      <h2>Who is buying the cameras?</h2>
      <div class="modes">
        <label><input type="radio" name="mode" value="self" checked>I will buy my own<small>Labor only. Cheaper if you already own them.</small></label>
        <label><input type="radio" name="mode" value="supply">NorthWatch Tech supplies them<small>Equipment and install included. Equipment deposit paid online.</small></label>
      </div>
    </section>
    <section>
      <h2>Cameras and extras</h2>
      <div id="items"></div>
      <div id="extras"></div>
    </section>
    <section>
      <h2>Your details</h2>
      <div class="fields">
        <label class="f">Full name<input type="text" id="name" autocomplete="name"></label>
        <label class="f">Phone<input type="tel" id="phone" autocomplete="tel"></label>
        <label class="f full">Email (your signed copy is sent here)<input type="email" id="email" autocomplete="email"></label>
        <label class="f full">Install address<input type="text" id="addr" autocomplete="street-address"></label>
        <label class="f">City<input type="text" id="city" autocomplete="address-level2"></label>
        <label class="f">ZIP<input type="text" id="zip" autocomplete="postal-code"></label>
        <label class="f full">Anything we should know? (best times, number of floors, brick or stone walls)<textarea id="notes"></textarea></label>
      </div>
    </section>
    <section>
      <h2>Agreement</h2>
      <div class="terms" id="terms" tabindex="0" aria-label="Terms and conditions"></div>
      <label class="chk"><input type="checkbox" id="agree"><span>I have read and agree to the terms above, and I confirm my Wi-Fi reaches each camera spot.</span></label>
      <label class="chk"><input type="checkbox" id="esign"><span>I agree to sign electronically. Typing my name below counts as my signature.</span></label>
      <label class="f">Type your full name to sign<input type="text" id="sigin" autocomplete="off"></label>
      <p class="sig" id="sigshow" aria-hidden="true"></p>
      <p class="note">Date signed: <span id="today"></span></p>
    </section>
  </div>
  <aside>
    <section>
      <h2>Your price</h2>
      <table class="sum" id="sum"></table>
      <div id="paywrap">
        <p class="note" id="paynote"></p>
        <div id="paypal"></div>
      </div>
      <button class="btn" id="send" type="button">Send my request</button>
      <div id="err" role="alert"></div>
    </section>
  </aside>
</div>
<section id="done">
  <h2>You are all set</h2>
  <p id="donetxt"></p>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script>
/* ===== CONFIG: fill these in ===== */
const CONFIG = {
  EMAILJS_PUBLIC_KEY: 'hfkNA0T28A4NbFUbw',
  EMAILJS_SERVICE_ID: 'service_hh0zyua',
  TEMPLATE_OWNER: 'template_yhteq6a',
  TEMPLATE_CUSTOMER: 'template_wmbhufh',
  OWNER_EMAIL: 'clrust2004@gmail.com',
  PAYPAL_CLIENT_ID: '',
  OFFER_HARDWIRED: true,   // set false until your insurance and local rules are confirmed
  MIN_VISIT: 175, SUPPLIES: 25, MASONRY: 30, HIGH: 55
};
/* hw = equipment cost, labor = install only. turnkey = hw + labor. Doorbell hw is a guess: edit it. */
const ITEMS = [
  {id:'wire', name:'Wire free / battery camera', hw:150, labor:115},
  {id:'solar', name:'Solar powered camera', hw:200, labor:115},
  {id:'plug', name:'Plug in outdoor camera', hw:115, labor:135},
  {id:'door', name:'Smart video doorbell', hw:160, labor:null, note:'Labor only is quoted separately. Pick supply to book online.'},
  {id:'flood', name:'Hardwired floodlight camera', hw:230, labor:195, note:'Replaces an existing light fixture only.'}
].filter(i => CONFIG.OFFER_HARDWIRED || i.id !== 'flood');

const S = {mode:'self', qty:{}, masonry:0, high:0};
ITEMS.forEach(i => S.qty[i.id] = 0);
const $ = id => document.getElementById(id);
const money = n => '$' + n.toFixed(2).replace('.00', '');
function laborOf(i){ return i.id === 'door' ? 115 : i.labor; }
function unitPrice(i){ return S.mode === 'supply' ? i.hw + laborOf(i) : i.labor; }
function cams(){ return ITEMS.reduce((n,i) => n + S.qty[i.id], 0); }

function compute(){
  const lines = [];
  ITEMS.forEach(i => { const q = S.qty[i.id]; if (q) lines.push([q + ' x ' + i.name, q * unitPrice(i)]); });
  const c = cams();
  if (c){
    if (S.masonry) lines.push([S.masonry + ' x Brick, stone, or stucco mounting', S.masonry * CONFIG.MASONRY]);
    if (S.high) lines.push([S.high + ' x High reach mounting', S.high * CONFIG.HIGH]);
    lines.push(['Mounting supplies', CONFIG.SUPPLIES]);
  }
  const sub = lines.reduce((n,l) => n + l[1], 0);
  let total = sub;
  if (c && sub < CONFIG.MIN_VISIT){ lines.push(['Minimum visit adjustment', CONFIG.MIN_VISIT - sub]); total = CONFIG.MIN_VISIT; }
  const equip = ITEMS.reduce((n,i) => n + S.qty[i.id] * i.hw, 0);
  const deposit = S.mode === 'supply' ? Math.min(equip, total) : 0;
  return {lines, total, deposit, balance: total - deposit};
}

function stepper(key, val, max, label){
  return '<div class="step"><button type="button" data-k="'+key+'" data-d="-1" aria-label="Remove one '+label+'"'+(val<=0?' disabled':'')+'>&minus;</button><output>'+val+'</output><button type="button" data-k="'+key+'" data-d="1" aria-label="Add one '+label+'"'+(val>=max?' disabled':'')+'>+</button></div>';
}

function render(){
  const supply = S.mode === 'supply';
  $('items').innerHTML = ITEMS.map(i => {
    const blocked = !supply && i.labor === null;
    if (blocked) S.qty[i.id] = 0;
    const price = blocked ? 'Quote' : money(unitPrice(i));
    return '<div class="row"><div class="nm">'+i.name+(i.note?'<small>'+i.note+'</small>':'')+'</div><div class="price">'+price+'</div>'+(blocked?'<div class="step"><span class="note">Not online</span></div>':stepper(i.id,S.qty[i.id],10,i.name))+'</div>';
  }).join('');
  const c = cams();
  S.masonry = Math.min(S.masonry, c); S.high = Math.min(S.high, c);
  $('extras').innerHTML =
    '<div class="row"><div class="nm">Brick, stone, or stucco mounting<small>Per camera that needs a hammer drill</small></div><div class="price">'+money(CONFIG.MASONRY)+'</div>'+stepper('masonry',S.masonry,c,'masonry camera')+'</div>'+
    '<div class="row"><div class="nm">High reach mounting<small>Per camera above a standard 8 foot ladder</small></div><div class="price">'+money(CONFIG.HIGH)+'</div>'+stepper('high',S.high,c,'high reach camera')+'</div>';

  const r = compute();
  $('sum').innerHTML = r.lines.length
    ? r.lines.map(l => '<tr><td>'+l[0]+'</td><td>'+money(l[1])+'</td></tr>').join('') +
      '<tr class="tot"><td>Estimated total</td><td>'+money(r.total)+'</td></tr>' +
      (supply ? '<tr class="due"><td>Equipment deposit due now</td><td>'+money(r.deposit)+'</td></tr><tr><td>Balance due after install</td><td>'+money(r.balance)+'</td></tr>'
              : '<tr><td>Due after install</td><td>'+money(r.total)+'</td></tr>')
    : '<tr><td class="note">Add a camera to see your price.</td></tr>';

  $('paywrap').style.display = supply && r.deposit > 0 ? 'block' : 'none';
  $('send').style.display = supply ? 'none' : 'block';
  $('paynote').textContent = CONFIG.PAYPAL_CLIENT_ID ? 'Pay the equipment deposit with a card or PayPal. We order your cameras once it clears.' : 'Online payment is not set up yet. Please contact us to book.';
  $('terms').innerHTML = termsList().map(t => '<p><strong>'+t[0]+'.</strong> '+t[1]+'</p>').join('');
}

function termsList(){
  const supply = S.mode === 'supply';
  return [
    ['Equipment', supply ? 'NorthWatch Tech buys the equipment listed in this order. The equipment deposit is due before we order and is not refundable once the equipment has been ordered.' : 'This order covers installation labor only. You buy and supply all equipment before we arrive. For equipment you supply, NorthWatch Tech is not responsible for defective products or manufacturer warranty claims.'],
    ['Wi-Fi and internet', 'We guarantee secure mounting and a working power connection. You are responsible for Wi-Fi signal strength and internet upload speed at each camera location. Extending Wi-Fi or fixing network problems is billed separately at an hourly rate, quoted before work begins.'],
    ['Existing electrical', 'Hardwired pricing assumes a working, code compliant junction box connected to a live breaker. If we find hidden electrical damage, or the job needs new wiring, we will stop and provide a written change order before continuing.'],
    ['Hidden items', 'NorthWatch Tech is not responsible for damage to wiring, pipes, or other items hidden inside walls that could not reasonably be seen before drilling.'],
    ['Workmanship', 'We stand behind our installation work for 90 days. If a mount comes loose or a connection we made fails during that time, we will fix it at no charge. This does not cover equipment defects or damage caused by weather, accidents, or other people.'],
    ['Changes and cancellations', 'Any work added after you sign needs your approval before we begin. Please give at least 24 hours notice to cancel or reschedule.'],
    ['Payment', (supply ? 'The equipment deposit is paid online. ' : '') + 'The balance is due in full when the installation is finished and we have completed the walkthrough with you.'],
    ['Minimum visit', 'Every visit has a minimum charge of ' + money(CONFIG.MIN_VISIT) + '. This price is an estimate valid for 30 days.']
  ];
}

function err(msg){ const e = $('err'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }

function validate(){
  if (!cams()) return 'Add at least one camera.';
  if (!$('name').value.trim()) return 'Enter your full name.';
  if (!/^\S+@\S+\.\S+$/.test($('email').value.trim())) return 'Enter a valid email so we can send your copy.';
  if ($('phone').value.replace(/\D/g,'').length < 10) return 'Enter a phone number with area code.';
  if (!$('addr').value.trim() || !$('city').value.trim() || !$('zip').value.trim()) return 'Enter the full install address.';
  if (!$('agree').checked) return 'Check the box to agree to the terms.';
  if (!$('esign').checked) return 'Check the box to agree to sign electronically.';
  if ($('sigin').value.trim().length < 3) return 'Type your full name to sign.';
  return '';
}

async function submitOrder(paymentId){
  const r = compute(), supply = S.mode === 'supply';
  const when = new Date().toLocaleString('en-US', {dateStyle:'long', timeStyle:'short'});
  const customer = $('name').value.trim();
  const summary = [
    'NORTHWATCH TECH ORDER', '',
    'Customer: ' + customer, 'Email: ' + $('email').value.trim(), 'Phone: ' + $('phone').value.trim(),
    'Address: ' + $('addr').value.trim() + ', ' + $('city').value.trim() + ', IN ' + $('zip').value.trim(),
    'Notes: ' + ($('notes').value.trim() || 'None'), '',
    'Equipment: ' + (supply ? 'Supplied by NorthWatch Tech' : 'Customer supplies'), '',
    ...r.lines.map(l => l[0] + ': ' + money(l[1])),
    'Estimated total: ' + money(r.total),
    supply ? 'Deposit paid: ' + money(r.deposit) + ' (PayPal order ' + paymentId + ')' : 'Nothing due until install is finished',
    'Balance due after install: ' + money(r.balance)
  ].join('\n');
  const buy = supply ? 'EQUIPMENT TO ORDER:\n' + ITEMS.filter(i => S.qty[i.id]).map(i => S.qty[i.id] + ' x ' + i.name + ' (equipment cost ' + money(i.hw) + ' each)').join('\n') : '';
  const terms = termsList().map(t => t[0] + ': ' + t[1]).join('\n\n');
  const base = {summary, terms, buy_list: buy, signature: $('sigin').value.trim(), signed_at: when, name: customer, email: $('email').value.trim()};
  emailjs.init({publicKey: CONFIG.EMAILJS_PUBLIC_KEY});
  await Promise.all([
    emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.TEMPLATE_OWNER, {...base, to_email: CONFIG.OWNER_EMAIL, subject: (supply ? 'NEW ORDER, buy cameras: ' : 'New booking request: ') + customer}),
    emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.TEMPLATE_CUSTOMER, {...base, to_email: $('email').value.trim(), subject: 'Your NorthWatch Tech signed order copy'})
  ]);
  $('app').style.display = 'none';
  $('done').style.display = 'block';
  $('donetxt').textContent = 'Thank you, ' + customer + '. A signed copy of your order is on its way to ' + $('email').value.trim() + '. We will contact you soon to set a time.';
  window.scrollTo(0, 0);
}

async function handleSend(paymentId){
  if (!CONFIG.EMAILJS_PUBLIC_KEY || !CONFIG.TEMPLATE_OWNER) { err('Booking emails are not set up yet. Please call or text us to book.'); return; }
  try { await submitOrder(paymentId || ''); }
  catch (e) {
    console.error('EmailJS error', e);
    const why = e && (e.text || e.message) ? ' (' + (e.status ? e.status + ': ' : '') + (e.text || e.message) + ')' : '';
    err('Your request did not send.' + why + ' Please try again or contact us directly.');
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  const k = b.dataset.k, d = +b.dataset.d;
  if (k in S.qty) S.qty[k] = Math.max(0, Math.min(10, S.qty[k] + d));
  else S[k] = Math.max(0, S[k] + d);
  render();
});
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => { S.mode = r.value; render(); }));
$('sigin').addEventListener('input', () => $('sigshow').textContent = $('sigin').value);
$('today').textContent = new Date().toLocaleDateString('en-US', {dateStyle:'long'});
$('send').addEventListener('click', () => { const m = validate(); err(m); if (!m) handleSend(''); });

if (CONFIG.PAYPAL_CLIENT_ID){
  const s = document.createElement('script');
  s.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(CONFIG.PAYPAL_CLIENT_ID) + '&currency=USD';
  s.onload = () => paypal.Buttons({
    onClick: (d, a) => { const m = validate(); err(m); return m ? a.reject() : a.resolve(); },
    createOrder: (d, a) => a.order.create({purchase_units:[{description:'NorthWatch Tech equipment deposit', amount:{value: compute().deposit.toFixed(2)}}]}),
    onApprove: async (d, a) => { const o = await a.order.capture(); await handleSend(o.id); },
    onError: () => err('The payment did not complete. Please try again or contact us.')
  }).render('#paypal');
  document.head.appendChild(s);
}
render();
</script>
</body>
</html>
